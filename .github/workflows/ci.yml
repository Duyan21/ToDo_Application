name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint (flake8 + ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install flake8 ruff

      - name: Run flake8
        run: |
          flake8 src/ \
            --exclude=src/tests \
            --max-line-length=120 \
            --extend-ignore=E203,W503

      - name: Run ruff
        run: |
          ruff check src/ \
            --exclude src/tests \
            --line-length 120

  test:
    name: Test (pytest + coverage)
    runs-on: ubuntu-latest
    needs: lint

    env:
      SECRET_KEY: ci-test-secret-key
      # Không set DB_HOST/DB_NAME/DB_DRIVER → app tự fallback SQLite

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run tests with coverage
        run: |
          pytest \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=60 \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
